<?xml version="1.0" encoding="UTF-8"?>
<!-- Image Analyzer Tool icon: a stack of frames (light, dark, calibrated)
     with the histogram and grey-level strip of the calibrated frame.
     Master artwork for 40 px and up; see app_32.svg, app_24.svg and app_16.svg
     for the simplified small sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24365A"/>
      <stop offset="1" stop-color="#111A2D"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECF3"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#23897C"/>
      <stop offset="1" stop-color="#3DBFAE"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tile)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="51.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Light frames (back) and dark frames (middle) -->
  <rect x="80" y="48" width="140" height="116" rx="14" fill="#E8A33A"/>
  <rect x="58" y="70" width="140" height="116" rx="14" fill="#5B80BC"/>
  <rect x="58" y="70" width="140" height="116" rx="14" fill="none" stroke="#111A2D" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Calibrated frame (front) -->
  <rect x="36" y="92" width="140" height="116" rx="14" fill="url(#card)"/>
  <rect x="36" y="92" width="140" height="116" rx="14" fill="none" stroke="#111A2D" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Histogram: 7 bars, bell-shaped, on a baseline at y = 176 -->
  <g fill="url(#bars)">
    <rect x="52"  y="166" width="12" height="10" rx="2"/>
    <rect x="68"  y="152" width="12" height="24" rx="2"/>
    <rect x="84"  y="129" width="12" height="47" rx="2"/>
    <rect x="100" y="112" width="12" height="64" rx="2"/>
    <rect x="116" y="138" width="12" height="38" rx="2"/>
    <rect x="132" y="157" width="12" height="19" rx="2"/>
    <rect x="148" y="167" width="12" height="9"  rx="2"/>
  </g>

  <!-- Grey-level strip under the histogram, as in the panels -->
  <rect x="52" y="184" width="108" height="9" rx="2.5" fill="url(#ramp)"/>
  <rect x="52" y="184" width="108" height="9" rx="2.5" fill="none" stroke="#111A2D" stroke-opacity="0.25" stroke-width="1"/>
</svg>
