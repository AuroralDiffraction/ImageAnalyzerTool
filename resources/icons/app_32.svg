<?xml version="1.0" encoding="UTF-8"?>
<!-- Icon drawn on a 32 px grid, so the bars are pixel-sharp at 32 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24365A"/>
      <stop offset="1" stop-color="#111A2D"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="url(#tile)"/>
  <rect x="10" y="6" width="18" height="15" rx="2" fill="#E8A33A"/>
  <rect x="7" y="9" width="18" height="15" rx="2" fill="#5B80BC"/>
  <rect x="4" y="12" width="18" height="15" rx="2" fill="#F3F6FA"/>
  <g fill="#23897C">
    <rect x="6"  y="21" width="2" height="2"/>
    <rect x="9"  y="18" width="2" height="5"/>
    <rect x="12" y="15" width="2" height="8"/>
    <rect x="15" y="19" width="2" height="4"/>
    <rect x="18" y="21" width="2" height="2"/>
  </g>
  <rect x="6" y="24" width="14" height="1" fill="url(#ramp)"/>
</svg>
